[project]
name = "anywhere-control"
version = "0.1.0"
description = "Anywhere control plane: intent planning, budget enforcement, provisioning, and the computer-use agent."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "httpx>=0.28",
  "langgraph>=1.2",
  "langchain-core>=1.7",
  "langchain-nvidia-ai-endpoints>=1.5",
  "structlog>=26.1",
  "pyjwt[crypto]>=2.10",
  "boto3>=1.43",
  "websockets>=15",
  "pyyaml>=6",
  "pillow>=11",
  "cua-sandbox>=0.9.1",
  "langgraph-checkpoint-sqlite>=3.1",
  "aiosqlite>=0.21",
]

[project.scripts]
anywhere = "anywhere.main:cli"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "respx>=0.22",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anywhere"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
# Line length is owned by `ruff format`; explicit timeouts are clearer than asyncio.timeout here.
ignore = ["E501", "ASYNC109", "UP047"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "anywhere.auth.Identity"]
